<!-- ============================================================
     ONA Relationship Intelligence — Version 4.1
     Author      : Sumit Mattey
     Organisation: Genpact — Salesforce Practice
     Updated     : 04 June 2026
     ============================================================ -->
<template>
<div class={appClass}>

    <!-- ══ TOP BAR ══════════════════════════════════════════════════════ -->
    <div class="ona-topbar">

        <!-- Row 1: Brand · Search · Actions -->
        <div class="ona-topbar-r1">
            <div class="ona-topbar-brand">
                <span class="ona-logo">ONA</span>
                <span class="ona-appname">Relationship Intelligence</span>
                <span class="ona-badge-new">Phase 2</span>
            </div>

            <div class="ona-search-wrap" lwc:ref="searchWrap">
                <span class="ona-search-icon">⌕</span>
                <input  class="ona-search"
                        type="text"
                        placeholder="Search accounts or contacts..."
                        value={searchTerm}
                        oninput={handleSearch}
                        onfocus={handleSearchFocus}
                        onblur={handleSearchBlur}/>
                <template if:true={isGlobal}>
                    <select class="ona-sel ona-sel-inline" onchange={handleIndustry}>
                        <option value="">All industries</option>
                        <option value="Technology">Technology</option>
                        <option value="Finance">Finance</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Manufacturing">Manufacturing</option>
                    </select>
                </template>
                <template if:true={showDropdown}>
                    <div class="ona-dropdown">
                        <template for:each={searchResults} for:item="res">
                            <div key={res.id} class={res.rowClass}
                                 data-id={res.id}
                                 data-name={res.name}
                                 data-type={res.type}
                                 data-accountid={res.accountId}
                                 data-accountname={res.accountName}
                                 onmousedown={selectResult}>
                                <div class="ona-ditem-left">
                                    <div class="ona-ditem-av">{res.initial}</div>
                                    <div>
                                        <div class="ona-dname">{res.name}</div>
                                        <div class="ona-dindustry">{res.subtitle}</div>
                                    </div>
                                </div>
                                <span class="ona-ditem-type">{res.icon}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <div class="ona-topbar-actions">
                <button class="ona-theme-btn" onclick={handleTheme} title="Toggle theme">{themeIcon}</button>
                <button class="ona-hbtn" onclick={handleRefresh}>↺ Refresh</button>
                <button class={activityBadgeBtnClass} onclick={handleToggleActivity} title="Toggle last activity date on nodes">
                    ⊙ Last Activity
                </button>

                <button class={summaryBellClass} onclick={toggleSummary} title="Relationship Summary">
                    <span>🔔</span>
                    <template if:true={bellDot}><span class="ona-bell-dot"></span></template>
                </button>
                <button class={campBtnClass} onclick={handleOpenCampPanel} title="Add contacts to campaign">
                    <span>📢</span>
                    <template if:true={campDot}><span class="ona-bell-dot"></span></template>
                </button>
                <button class="ona-hbtn ona-guide-btn" onclick={handleGuide}>? Guide</button>
            </div>
        </div>

        <!-- Row 2: View cards · Filters -->
        <div class="ona-topbar-r2">

            <!-- View selector cards -->
            <div class="ona-view-cards">
                <button class={accCardClass} onclick={handleAccountMode}>
                    <span class="ona-vc-icon">◎</span>
                    <div class="ona-vc-text">
                        <span class="ona-vc-title">Network Map</span>
                        <span class="ona-vc-sub">Single account view</span>
                    </div>
                </button>
                <button class={glbCardClass} onclick={handleGlobalMode}>
                    <span class="ona-vc-icon">⬡</span>
                    <div class="ona-vc-text">
                        <span class="ona-vc-title">Cross-Account</span>
                        <span class="ona-vc-sub">Multi-account network</span>
                    </div>
                </button>
                <button class={portCardClass} onclick={handlePortfolioMode}>
                    <span class="ona-vc-icon">▦</span>
                    <div class="ona-vc-text">
                        <span class="ona-vc-title">Portfolio View</span>
                        <span class="ona-vc-sub">Account health scores</span>
                    </div>
                </button>
                <button class={analyticsCardClass} onclick={handleAnalyticsMode}>
                    <span class="ona-vc-icon">◈</span>
                    <div class="ona-vc-text">
                        <span class="ona-vc-title">Analytics</span>
                        <span class="ona-vc-sub">Graph intelligence</span>
                    </div>
                    <span class="ona-vc-new" style="background:#059669">New</span>
                </button>
                <button class={compareCardClass} onclick={handleCompareMode}>
                    <span class="ona-vc-icon">⇌</span>
                    <div class="ona-vc-text">
                        <span class="ona-vc-title">Compare</span>
                        <span class="ona-vc-sub">Side-by-side accounts</span>
                    </div>
                    <span class="ona-vc-new" style="background:#4338ca">New</span>
                </button>
            </div>

            <div class="ona-topbar-r2-sep"></div>

            <!-- Filter chips -->
            <div class="ona-filter-chips">
                <span class="ona-fc-label">Filters</span>

                <select class={countryChipClass} onchange={handleFilterCountry}>
                    <option value="">🌍 Country</option>
                    <template for:each={filterCountries} for:item="opt">
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                    </template>
                </select>

                <select class={regionChipClass} onchange={handleFilterRegion}>
                    <option value="">📍 Region</option>
                    <template for:each={filterRegions} for:item="opt">
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                    </template>
                </select>

                <select class={deptChipClass} onchange={handleFilterDept}>
                    <option value="">🏢 Department</option>
                    <template for:each={filterDepts} for:item="opt">
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                    </template>
                </select>

                <select class={seniorityChipClass} onchange={handleFilterSeniority}>
                    <option value="">👤 Seniority</option>
                    <option value="clevel">C-Level</option>
                    <option value="vp">VP / Director</option>
                    <option value="manager">Manager</option>
                    <option value="ic">Individual Contributor</option>
                </select>

                <select class={strengthChipClass} onchange={handleFilterStrength}>
                    <option value="">🔗 Relationship</option>
                    <option value="strong">Strong only (≥15)</option>
                    <option value="medium">Medium + (≥6)</option>
                    <option value="weak">All (≥2)</option>
                </select>

                <template if:true={hasActiveFilters}>
                    <button class="ona-filter-clear" onclick={handleClearFilters}>✕ Clear</button>
                </template>
                <span class="ona-filter-count">{filterCountLabel}</span>
            </div>
        </div>
    </div>

    <!-- ══ NETWORK MAP + CROSS-ACCOUNT PANE ═══════════════════════════ -->
    <template if:true={isNetworkMode}>
    <div class="ona-body">

        <!-- Left panel -->
        <div class="ona-lpanel">
            <div class="ona-lps">
                <span class="ona-lpt">Network metrics</span>
                <div class="ona-kgrid">
                    <div class="ona-kpi"><div class="ona-kval">{stats.totalContacts}</div><div class="ona-klbl">Contacts<c-ona-help-tip term="contacts" position="right"></c-ona-help-tip></div></div>
                    <div class="ona-kpi"><div class="ona-kval">{stats.totalEdges}</div><div class="ona-klbl">Relationships<c-ona-help-tip term="relationships" position="right"></c-ona-help-tip></div></div>
                    <div class="ona-kpi"><div class="ona-kval">{stats.hubCount}</div><div class="ona-klbl">Hubs<c-ona-help-tip term="hubs" position="right"></c-ona-help-tip></div></div>
                    <div class="ona-kpi"><div class="ona-kval">{stats.clusterCount}</div><div class="ona-klbl">Clusters<c-ona-help-tip term="clusters" position="right"></c-ona-help-tip></div></div>
                </div>
            </div>

            <template if:true={hasAccountIntel}>
            <div class="ona-lps">
                <span class="ona-lpt">Account intelligence <span class="ona-lpt-badge">New</span></span>
                <div class="ona-ai-metric">
                    <div class="ona-ai-label"><span>Coverage score<c-ona-help-tip term="coverage-score" position="right"></c-ona-help-tip></span><span class="ona-ai-badge" style={covBadgeStyle}>{accountIntel.coverageBadge}</span></div>
                    <div class="ona-ai-val">{accountIntel.coverageScore}%</div>
                    <div class="ona-sbar"><div class="ona-sfill" style={covBarStyle}></div></div>
                    <div class="ona-ai-desc">{covDesc}</div>
                    <template if:true={trendHasHistory}>
                        <div class={covTrendClass}>{covTrendLabel}</div>
                    </template>
                </div>
                <div class="ona-ai-metric">
                    <div class="ona-ai-label"><span>Multi-thread risk<c-ona-help-tip term="multi-thread" position="right"></c-ona-help-tip></span><span class="ona-ai-badge" style={mtBadgeStyle}>{accountIntel.multiThreadBadge}</span></div>
                    <div class="ona-ai-val">{accountIntel.multiThreadScore}%</div>
                    <div class="ona-sbar"><div class="ona-sfill" style={mtBarStyle}></div></div>
                    <div class="ona-ai-desc">{mtDesc}</div>
                    <template if:true={trendHasHistory}>
                        <div class={mtTrendClass}>{mtTrendLabel}</div>
                    </template>
                </div>
                <div style="margin-top:6px">
                    <div class="ona-ws-title">Whitespace gaps<c-ona-help-tip term="whitespace" position="right"></c-ona-help-tip></div>
                    <template for:each={whitespace} for:item="ws">
                        <div key={ws.department} class="ona-ws-item">
                            <span class="ona-ws-dept">{ws.department}</span>
                            <span class="ona-ws-status" style={ws.statusStyle}>{ws.statusLabel}</span>
                        </div>
                    </template>
                </div>
            </div>
            </template>

            <div class="ona-lps">
                <span class="ona-lpt">Insight questions</span>
                <div class={iq1Class} data-mode="connections" onclick={handleHL}><div class="ona-iqn">Q1 · Connectivity</div>How are contacts connected?</div>
                <div class={iq2Class} data-mode="influence"   onclick={handleHL}><div class="ona-iqn">Q2 · Influence</div>Who are the most influential?</div>
                <div class={iq3Class} data-mode="centrality"  onclick={handleHL}><div class="ona-iqn">Q3 · Centrality</div>Who is central to communication?</div>
                <div class={iq4Class} data-mode="engage"      onclick={handleHL}><div class="ona-iqn">Q4 · Engagement</div>Who should I engage next?</div>
                <div class={iq5Class} data-mode="velocity"    onclick={handleHL}>
                    <div class="ona-iqn">Q5 · Velocity <span class="ona-lpt-badge">New</span></div>Which relationships are warming up?
                </div>
            </div>

            <template if:true={hasConnections}>
            <div class="ona-lps">
                <span class="ona-lpt">Connections of {connNodeName}</span>
                <template for:each={connList} for:item="conn">
                    <div key={conn.id} class="ona-conn-item">
                        <div class="ona-conn-dot" style={conn.dotStyle}></div>
                        <span class="ona-conn-name">{conn.name}</span>
                        <span class="ona-conn-str" style={conn.strStyle}>{conn.strength}</span>
                    </div>
                </template>
            </div>
            </template>

            <div class="ona-lps">
                <span class="ona-lpt">Node types</span>
                <div class="ona-legrow"><div class="ona-legdot" style="background:#b45309"></div>Hub — centrality ≥ 70</div>
                <div class="ona-legrow"><div class="ona-legdot" style="background:#0369a1"></div>Active connector</div>
                <div class="ona-legrow"><div class="ona-legdot" style="background:#4338ca"></div>Cross-account bridge</div>
                <div class="ona-legrow"><div class="ona-legdot" style="background:#94a3b8"></div>Low engagement</div>
            </div>
            <div class="ona-lps">
                <span class="ona-lpt">Velocity indicators <span class="ona-lpt-badge">New</span></span>
                <div class="ona-legrow"><span class="ona-vel-arrow" style="color:#059669">↑</span> Growing — activity up</div>
                <div class="ona-legrow"><span class="ona-vel-arrow" style="color:#dc2626">↓</span> Cooling — activity down</div>
                <div class="ona-legrow"><span class="ona-vel-arrow" style="color:#94a3b8">→</span> Stable — no change</div>
            </div>
            <div class="ona-lps">
                <span class="ona-lpt">Edge strength</span>
                <div class="ona-legrow"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#b45309" stroke-width="3" stroke-opacity="0.85"/></svg>Strong (≥ 15)</div>
                <div class="ona-legrow"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#4a7fa8" stroke-width="1.8" stroke-opacity="0.65"/></svg>Medium (6–14)</div>
                <div class="ona-legrow"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5,4" stroke-opacity="0.40"/></svg>Weak (2–5)</div>
            </div>
        </div>

        <!-- Graph area -->
        <div class="ona-garea" lwc:ref="graphContainer">
            <template if:true={isLoading}>
                <div class="ona-state"><div class="ona-spinner"></div><div class="ona-state-title">Loading relationship graph…</div></div>
            </template>
            <template if:true={hasError}>
                <div class="ona-state"><div class="ona-state-ico">⚠</div><div class="ona-state-title">Something went wrong</div><div class="ona-state-sub">{errorMsg}</div></div>
            </template>
            <template if:true={showEmpty}>
                <div class="ona-state">
                    <div class="ona-state-ico">◎</div>
                    <div class="ona-state-title">Select an account to begin</div>
                    <div class="ona-state-sub">Search for an account above or switch to Cross-Account view</div>
                </div>
            </template>
            <div lwc:ref="svgContainer" class="ona-svg-cont"></div>
            <div class={tipClass} lwc:ref="graphTooltip">
                <div class="ona-tn">{tip.name}</div>
                <div class="ona-tr">{tip.role}</div>
                <div class="ona-ta">{tip.acct}</div>
                <div class="ona-tsc">
                    <div class="ona-tsi"><span class="ona-tsv">{tip.inf}</span><span class="ona-tsl">Influence</span></div>
                    <div class="ona-tsi"><span class="ona-tsv">{tip.cen}</span><span class="ona-tsl">Centrality</span></div>
                    <div class="ona-tsi"><span class="ona-tsv">{tip.btw}</span><span class="ona-tsl">Betweenness</span></div>
                    <div class="ona-tsi"><span class="ona-tsv">{tip.con}</span><span class="ona-tsl">Connections</span></div>
                </div>
                <div class="ona-tv" style={tip.velStyle}>{tip.velArrow} {tip.velLabel}</div>
                <template if:true={tip.championRisk}>
                    <div class="ona-tip-champ">⚠ Champion Risk — {tip.championReason}</div>
                </template>

                <!-- Seller Interaction Layer (v4.2) -->
                <div class="ona-tip-divider"></div>
                <div class="ona-tip-seller-hdr">
                    <span class="ona-tip-seller-ico">👤</span>
                    <span class="ona-tip-seller-lbl">Team Interactions</span>
                </div>
                <template if:true={tip.hasSellers}>
                    <template for:each={tip.sellers} for:item="s">
                        <div key={s.repId} class="ona-tip-seller-row">
                            <div class="ona-tip-seller-dot" style={s.dotStyle}></div>
                            <span class="ona-tip-seller-name">{s.repName}</span>
                            <span class="ona-tip-seller-when">{s.whenLabel}</span>
                            <span class="ona-tip-seller-count">{s.countLabel}</span>
                        </div>
                    </template>
                    <div class="ona-tip-seller-footer">Most active: {tip.mostActive}</div>
                </template>
                <template if:false={tip.hasSellers}>
                    <div class="ona-tip-seller-empty">No team interactions logged</div>
                </template>
            </div>
            <div class="ona-zctrls">
                <button class="ona-zbtn" onclick={handleZoomIn}>+</button>
                <button class="ona-zbtn" onclick={handleZoomOut}>−</button>
                <button class="ona-zbtn" onclick={handleZoomReset}>↺</button>
            </div>
            <div class="ona-ghint">Click a node to explore · Click canvas to reset</div>
        </div>

        <!-- Right insight panel -->
        <div class={panelClass}>
            <div class="ona-rpanel-inner">
                <div class="ona-iph">
                    <div class="ona-ipav" style={avStyle}>{contact.initials}</div>
                    <div style="flex:1;min-width:0">
                        <div class="ona-ipname">{contact.name} <span class={compBadgeClass} title={compBadgeTitle}>{compBadgeIcon}</span></div>
                        <div class="ona-iprole">{contact.title}</div>
                        <div class="ona-ipacct">{contact.accountName}</div>
                        <div class="ona-ipdept">{contact.department}</div>
                        <span class="ona-ipbadge" style={badgeStyle}>{contact.networkRole}</span>
                    </div>
                    <button class="ona-xbtn" onclick={closePanel}>✕</button>
                </div>
                <div class="ona-rpanel-scroll">
                    <div class="ona-ips">
                        <span class="ona-ipst">Contact details</span>
                        <div class={cdSummaryClass}>{cdSummaryLabel}</div>
                        <div class="ona-cd-grid">
                            <div class="ona-cd-cell" data-field="phone" onclick={handleCopyField}>
                                <span class="ona-cd-ico">📞</span>
                                <div class="ona-cd-cell-text">
                                    <span class="ona-cd-cell-lbl">Phone</span>
                                    <span class={cdPhoneClass}>{cdPhoneValue}</span>
                                </div>
                            </div>
                            <div class="ona-cd-cell" data-field="mobile" onclick={handleCopyField}>
                                <span class="ona-cd-ico">📱</span>
                                <div class="ona-cd-cell-text">
                                    <span class="ona-cd-cell-lbl">Mobile</span>
                                    <span class={cdMobileClass}>{cdMobileValue}</span>
                                </div>
                            </div>
                            <div class="ona-cd-cell" data-field="email" onclick={handleCopyField}>
                                <span class="ona-cd-ico">📧</span>
                                <div class="ona-cd-cell-text">
                                    <span class="ona-cd-cell-lbl">Email</span>
                                    <span class={cdEmailClass}>{cdEmailValue}</span>
                                </div>
                            </div>
                            <div class="ona-cd-cell" data-field="title" onclick={handleCopyField}>
                                <span class="ona-cd-ico">💼</span>
                                <div class="ona-cd-cell-text">
                                    <span class="ona-cd-cell-lbl">Title</span>
                                    <span class={cdTitleClass}>{cdTitleValue}</span>
                                </div>
                            </div>
                        </div>
                        <template if:true={cdCopiedField}>
                            <div class="ona-cd-toast">Copied {cdCopiedField} ✓</div>
                        </template>
                    </div>
                    <div class="ona-ips">
                        <span class="ona-ipst">ONA scores</span>
                        <div class="ona-sgrid">
                            <div class="ona-sc"><div class="ona-scv">{contact.influenceScore}</div><div class="ona-scl">Influence<c-ona-help-tip term="influence" position="top"></c-ona-help-tip></div><div class="ona-sbar"><div class="ona-sfill" style={infBarStyle}></div></div><div class="ona-scd">{contact.influenceDesc}</div></div>
                            <div class="ona-sc"><div class="ona-scv">{contact.centralityScore}</div><div class="ona-scl">Centrality<c-ona-help-tip term="centrality" position="top"></c-ona-help-tip></div><div class="ona-sbar"><div class="ona-sfill" style={cenBarStyle}></div></div><div class="ona-scd">{contact.centralityDesc}</div></div>
                            <div class="ona-sc ona-sc-new-green"><div class="ona-scv">{contact.decayScore}</div><div class="ona-scl">Decay score<c-ona-help-tip term="decay-score" position="top"></c-ona-help-tip> <span class="ona-score-badge ona-score-badge-green">New</span></div><div class="ona-sbar"><div class="ona-sfill" style={decBarStyle}></div></div><div class="ona-scd">{contact.decayDesc}</div></div>
                            <div class="ona-sc ona-sc-new-purple"><div class="ona-scv">{contact.betweennessScore}</div><div class="ona-scl">Betweenness<c-ona-help-tip term="betweenness" position="top"></c-ona-help-tip> <span class="ona-score-badge ona-score-badge-purple">New</span></div><div class="ona-sbar"><div class="ona-sfill" style={betwBarStyle}></div></div><div class="ona-scd">{contact.betweennessDesc}</div></div>
                        </div>
                    </div>
                    <div class="ona-ips">
                        <span class="ona-ipst">Velocity trend<c-ona-help-tip term="velocity" position="right"></c-ona-help-tip> <span class="ona-lpt-badge">New</span></span>
                        <div class="ona-vel-row">
                            <span class="ona-vel-big" style={velBigStyle}>{contact.velocityArrow}</span>
                            <div><div class="ona-vel-label" style={velLabelStyle}>{contact.velocityLabel}</div><div class="ona-vel-sub">Last 90 days vs prior 90 days</div></div>
                        </div>
                        <div class="ona-vel-desc">{contact.velocityDesc}</div>
                    </div>
                    <div class="ona-ips">
                        <span class="ona-ipst">Warm intro paths <span class="ona-lpt-badge">New</span></span>
                        <template if:true={hasIntroPaths}>
                            <template for:each={introPaths} for:item="path">
                                <div key={path.targetContactId} class="ona-path-box">
                                    <div class="ona-path-title">Route to {path.targetName}</div>
                                    <div class="ona-path-steps">
                                        <template for:each={path.steps} for:item="step">
                                            <span key={step.nodeKey} class={step.nodeClass}>{step.name}</span>
                                            <template if:false={step.isTarget}><span key={step.arrowKey} class="ona-path-arrow">→</span></template>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasIntroPaths}>
                            <div class="ona-ipempty">All nearby contacts already connected.</div>
                        </template>
                    </div>
                    <div class="ona-ips">
                        <span class="ona-ipst">Activity summary (12 months)</span>
                        <div class="ona-apills">
                            <div class="ona-ap"><div class="ona-apv">{contact.emailCount}</div><div class="ona-apl">Emails</div></div>
                            <div class="ona-ap"><div class="ona-apv">{contact.meetingCount}</div><div class="ona-apl">Meetings</div></div>
                            <div class="ona-ap"><div class="ona-apv">{contact.taskCount}</div><div class="ona-apl">Tasks</div></div>
                        </div>
                        <div class="ona-lastact">{contact.lastAct}</div>
                    </div>
                    <div class="ona-ips">
                        <span class="ona-ipst">Recent activity</span>
                        <template if:true={loadingInsight}><div class="ona-ipempty">Loading…</div></template>
                        <template for:each={timeline} for:item="act">
                            <div key={act.id} class="ona-tlitem">
                                <div class="ona-tldot" style={act.dotStyle}></div>
                                <div><div class="ona-tltext">{act.subject}</div><div class="ona-tldate">{act.activityDate}</div><span class="ona-tlbadge" style={act.badgeStyle}>{act.activityType}</span></div>
                            </div>
                        </template>
                        <template if:false={hasTimeline}>
                            <template if:false={loadingInsight}><div class="ona-ipempty">No recent activity logged.</div></template>
                        </template>
                    </div>
                    <div class="ona-ips ona-ipslast">
                        <span class="ona-ipst">Recommended next engagements</span>
                        <template if:true={loadingInsight}><div class="ona-ipempty">Loading…</div></template>
                        <template for:each={recos} for:item="reco">
                            <div key={reco.candidate.contactId} class="ona-rcard"
                                 data-id={reco.candidate.contactId} onclick={handleRecoClick}>
                                <div class="ona-rtop">
                                    <div class="ona-rav" style={reco.avStyle}>{reco.candidate.initials}</div>
                                    <div><div class="ona-rname">{reco.candidate.name}</div><div class="ona-rrole">{reco.candidate.title}</div></div>
                                    <span class="ona-rbadge" style={reco.badgeStyle}>{reco.priority}</span>
                                </div>
                                <div class="ona-rwhy">{reco.reason}</div>
                            </div>
                        </template>
                        <template if:false={hasRecos}>

                        <div class="ona-sp-mval" style="color:#059669">{summaryData.growing}</div>
                        <div class="ona-sp-mlbl">Growing ↑</div>
                    </div>
                    <div class="ona-sp-metric">
                        <div class="ona-sp-mval">{summaryData.stable}</div>
                        <div class="ona-sp-mlbl">Stable →</div>
                    </div>
                    <div class="ona-sp-metric">
                        <div class="ona-sp-mval" style="color:#dc2626">{summaryData.cooling}</div>
                        <div class="ona-sp-mlbl">Cooling ↓</div>
                    </div>
                </div>
                <div class="ona-sp-vel-bar">
                    <template for:each={summaryData.velSegs} for:item="seg">
                        <div key={seg.key} style={seg.style}></div>
                    </template>
                </div>
            </div>

            <!-- 5. Relationship Access -->
            <div class="ona-sp-sec">
                <div class="ona-sp-sec-hdr">
                    <span class="ona-sp-sec-dot" style="background:#4338ca"></span>
                    <span class="ona-sp-sec-lbl">Relationship Access</span>
                    <span class="ona-sp-sec-score">{summaryData.introCount}</span>
                </div>
                <template for:each={summaryData.introPaths} for:item="path">
                    <div key={path.id} class="ona-sp-intro-item">
                        <div class="ona-sp-intro-route">
                            <span class="ona-sp-intro-node">You</span>
                            <span class="ona-sp-intro-arrow">→</span>
                            <span class="ona-sp-intro-node">{path.bridgeName}</span>
                            <span class="ona-sp-intro-arrow">→</span>
                            <span class="ona-sp-intro-target">{path.targetName}</span>
                        </div>
                        <div class="ona-sp-intro-lbl">{path.label}</div>
                    </div>
                </template>
            </div>

            <!-- 6. Insights -->
            <div class="ona-sp-sec ona-sp-sec-last">
                <div class="ona-sp-sec-hdr">
                    <span class="ona-sp-sec-dot" style="background:#94a3b8"></span>
                    <span class="ona-sp-sec-lbl">Key Insights</span>
                </div>
                <template for:each={summaryData.insights} for:item="ins">
                    <div key={ins.key} class="ona-sp-insight">
                        <div class="ona-sp-insight-dot" style={ins.dotStyle}></div>
                        <div class="ona-sp-insight-text">{ins.text}</div>
                    </div>
                </template>
            </div>

        </template>
        </div>
    </div>
    </template>

    <!-- ══ ANALYTICS PANE ═══════════════════════════════════════════ -->
    <template if:true={isAnalyticsMode}>
    <div class="ona-analytics-shell">
        <div class="ona-an-nav">
            <button class={anTabTimeline}  data-tab="timeline"  onclick={handleAnTab}>⏱ Timeline</button>
            <button class={anTabPowermap}  data-tab="powermap"  onclick={handleAnTab}>🏢 Power Map</button>
            <button class={anTabCascade}   data-tab="cascade"   onclick={handleAnTab}>💥 Impact Sim</button>
            <button class={anTabRisk}      data-tab="risk"      onclick={handleAnTab}>⚔ Risk Radar</button>
            <div style="flex:1"></div>
            <span class="ona-an-acct-lbl">{analyticsAcctLabel}</span>
        </div>

        <!-- Timeline -->
        <template if:true={anIsTimeline}>
        <div class="ona-an-section">
            <div class="ona-an-ctrl-bar">
                <span class="ona-an-ctrl-lbl">Network as of:</span>
                <input type="range" class="ona-an-slider" min="0" max="5"
                    value={timelineValue} oninput={handleTimelineSlide}/>
                <span class="ona-an-ctrl-val">{timelineLabel}</span>
                <div class="ona-an-kpis">
                    <div class="ona-an-kpi"><div class="ona-an-kpi-v">{timelineStats.contacts}</div><div class="ona-an-kpi-l">Contacts</div></div>
                    <div class="ona-an-kpi"><div class="ona-an-kpi-v">{timelineStats.edges}</div><div class="ona-an-kpi-l">Edges</div></div>
                    <div class="ona-an-kpi"><div class="ona-an-kpi-v" style={timelineStats.covStyle}>{timelineStats.cov}%</div><div class="ona-an-kpi-l">Coverage</div></div>
                </div>
            </div>
            <div class="ona-an-graph" lwc:ref="timelineContainer"></div>
        </div>
        </template>

        <!-- Power Map -->
        <template if:true={anIsPowermap}>
        <div class="ona-an-section">
            <div class="ona-an-ctrl-bar">
                <span class="ona-an-ctrl-lbl">Node size:</span>
                <select class="ona-sel" onchange={handlePmSize}>
                    <option value="influence">Influence Score</option>
                    <option value="centrality">Centrality Score</option>
                    <option value="betweenness">Betweenness</option>
                </select>
                <span class="ona-an-ctrl-lbl">Colour:</span>
                <select class="ona-sel" onchange={handlePmColour}>
                    <option value="velocity">Velocity</option>
                    <option value="type">Node type</option>
                    <option value="seniority">Seniority</option>
                </select>
            </div>
            <div class="ona-an-graph" lwc:ref="powermapContainer"></div>
        </div>
        </template>

        <!-- Impact Simulation -->
        <template if:true={anIsCascade}>
        <div class="ona-an-section">
            <div class="ona-an-ctrl-bar">
                <span class="ona-an-ctrl-lbl">Remove contact:</span>
                <select class="ona-sel" style="max-width:220px" onchange={handleCascadeSelect}>
                    <option value="">— Select a contact —</option>
                    <template for:each={_nodes} for:item="n">
                        <option key={n.contactId} value={n.contactId}>{n.name}</option>
                    </template>
                </select>
                <button class="ona-hbtn" onclick={handleCascadeReset}>↺ Reset</button>
            </div>
            <div class="ona-an-split">
                <div class="ona-an-graph" lwc:ref="cascadeContainer"></div>
                <div class="ona-an-side">
                    <div class="ona-an-panel-title">Impact Simulator</div>
                    <div class="ona-an-panel-sub">{cascadeHint}</div>

                    <template if:true={cascadeSelected}>
                        <!-- Before / After grid -->
                        <div class="ona-cas-grid">
                            <div class="ona-cas-col">
                                <div class="ona-cas-col-hdr">Before</div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Coverage</span>
                                    <span class="ona-cas-val">{cascadeBefore.cov}%</span>
                                </div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Multi-thread</span>
                                    <span class="ona-cas-val">{cascadeBefore.mt}%</span>
                                </div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Contacts</span>
                                    <span class="ona-cas-val">{cascadeBefore.contacts}</span>
                                </div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Edges</span>
                                    <span class="ona-cas-val">{cascadeBefore.edges}</span>
                                </div>
                            </div>
                            <div class="ona-cas-col ona-cas-col-after">
                                <div class="ona-cas-col-hdr">After removal</div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Coverage</span>
                                    <span class="ona-cas-val">{cascadeAfter.cov}%</span>
                                    <span style={cascadeCovDeltaStyle}>{cascadeCovDeltaLabel}</span>
                                </div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Multi-thread</span>
                                    <span class="ona-cas-val">{cascadeAfter.mt}%</span>
                                    <span style={cascadeMtDeltaStyle}>{cascadeMtDeltaLabel}</span>
                                </div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Contacts</span>
                                    <span class="ona-cas-val">{cascadeAfter.contacts}</span>
                                </div>
                                <div class="ona-cas-metric">
                                    <span class="ona-cas-lbl">Edges</span>
                                    <span class="ona-cas-val">{cascadeAfter.edges}</span>
                                    <span style={cascadeCovDeltaStyle}>{cascadeEdgeDeltaLabel}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Isolated contacts -->
                        <template if:true={hasCascadeIsolated}>
                            <div class="ona-cas-isolated-hdr">Contacts now isolated</div>
                            <div class="ona-cas-isolated-list">
                                <template for:each={cascadeIsolated} for:item="ci">
                                    <span key={ci.id} class="ona-cas-chip">⚠ {ci.name}</span>
                                </template>

                            </div>
                        </template>
                        <template if:false={hasCascadeIsolated}>
                            <div class="ona-cas-no-iso">✓ No contacts become isolated</div>
                        </template>

                        <!-- Risk assessment -->
                        <div class="ona-cas-risk-hdr">Risk assessment</div>
                        <div class="ona-cas-risk-txt" style={cascadeImpactStyle}>{cascadeImpact}</div>
                    </template>
                </div>
            </div>
        </div>
        </template>

        <!-- Risk Radar -->
        <template if:true={anIsRisk}>
        <div class="ona-an-section">
            <div class="ona-an-ctrl-bar">
                <span class="ona-an-ctrl-lbl">Risk type:</span>
                <select class="ona-sel" onchange={handleRiskType}>
                    <option value="all">All risks</option>
                    <option value="spof">Single-point-of-failure</option>
                    <option value="decay">Relationship decay</option>
                    <option value="dark">No CRM activity</option>
                </select>
            </div>
            <div class="ona-an-split">
                <div class="ona-an-graph" lwc:ref="riskContainer"></div>
                <div class="ona-an-side">
                    <div class="ona-an-panel-title">Risk Radar</div>
                    <div class="ona-an-panel-sub" style="margin-bottom:10px">{riskSummary}</div>
                    <template for:each={riskItems} for:item="ri">
                        <div key={ri.id} class="ona-risk-item" style={ri.itemStyle}>
                            <div class="ona-risk-item-top">
                                <span class="ona-risk-icon-badge" style={ri.iconBgStyle}>{ri.icon}</span>
                                <div style="flex:1;min-width:0">
                                    <div class="ona-risk-name">{ri.name}</div>
                                    <div class="ona-risk-title">{ri.title}</div>
                                </div>
                            </div>
                            <div class="ona-risk-desc">{ri.desc}</div>
                            <span class="ona-risk-tag" style={ri.tagStyle}>{ri.label}</span>
                        </div>
                    </template>
                    <template if:false={hasRiskItems}>
                        <div class="ona-risk-clear">✓ No risks detected for this filter.</div>
                    </template>
                </div>
            </div>
        </div>
        </template>
    </div>
    </template>

    <!-- ══ ACCOUNT COMPARISON PANE ════════════════════════════════ -->
    <template if:true={isCompareMode}>
    <div class="ona-cmp-shell">

        <!-- Search bar -->
        <div class="ona-cmp-search-bar">
            <div class="ona-cmp-search-wrap">
                <div class="ona-cmp-search-lbl">Account A</div>
                <div style="position:relative">
                    <input class="ona-cmp-input" type="text" placeholder="Search first account…"
                        value={compareSearchA} oninput={handleCmpSearchA}/>
                    <template if:true={hasCmpDropA}>
                    <div class="ona-cmp-dropdown">
                        <template for:each={cmpDropA} for:item="acc">
                            <div key={acc.Id} class="ona-cmp-drop-item"
                                data-id={acc.Id} data-name={acc.Name} data-side="a"
                                onclick={handleCmpSelect}>{acc.Name}</div>
                        </template>
                    </div>
                    </template>
                </div>
            </div>
            <div class="ona-cmp-vs-badge">VS</div>
            <div class="ona-cmp-search-wrap">
                <div class="ona-cmp-search-lbl">Account B</div>
                <div style="position:relative">
                    <input class="ona-cmp-input" type="text" placeholder="Search second account…"
                        value={compareSearchB} oninput={handleCmpSearchB}/>
                    <template if:true={hasCmpDropB}>
                    <div class="ona-cmp-dropdown">
                        <template for:each={cmpDropB} for:item="acc">
                            <div key={acc.Id} class="ona-cmp-drop-item"
                                data-id={acc.Id} data-name={acc.Name} data-side="b"
                                onclick={handleCmpSelect}>{acc.Name}</div>
                        </template>
                    </div>
                    </template>
                </div>
            </div>
            <button class="ona-hbtn" style="margin-left:8px;padding:7px 18px" onclick={handleRunComparison}>Compare →</button>
        </div>

        <!-- Empty state -->
        <template if:false={hasCmpResults}>
        <div class="ona-cmp-empty">
            <div class="ona-cmp-empty-icon">⇌</div>
            <div class="ona-cmp-empty-title">Select two accounts to compare</div>
            <div class="ona-cmp-empty-sub">Search for any two accounts above and click Compare</div>
        </div>
        </template>

        <!-- Results -->
        <template if:true={hasCmpResults}>
        <div class="ona-cmp-results">

            <!-- Account headers -->
            <div class="ona-cmp-acct-headers">
                <div class="ona-cmp-acct-card" style={cmpResults.headerStyleA}>
                    <div class="ona-cmp-acct-name">{cmpResults.nameA}</div>
                    <span class="ona-cmp-acct-badge" style={cmpResults.badgeStyleA}>{cmpResults.badgeA}</span>
                    <div class="ona-cmp-acct-meta">{cmpResults.metaA}</div>
                </div>
                <div class="ona-cmp-vs-mid">VS</div>
                <div class="ona-cmp-acct-card" style={cmpResults.headerStyleB}>
                    <div class="ona-cmp-acct-name">{cmpResults.nameB}</div>
                    <span class="ona-cmp-acct-badge" style={cmpResults.badgeStyleB}>{cmpResults.badgeB}</span>
                    <div class="ona-cmp-acct-meta">{cmpResults.metaB}</div>
                </div>
            </div>

            <!-- Network size tiles -->
            <div class="ona-cmp-section-lbl">Network Size</div>
            <div class="ona-cmp-tiles-row">
                <div class="ona-cmp-tiles-side">
                    <template for:each={cmpResults.tilesA} for:item="t">
                        <div key={t.lbl} class={t.cls}>
                            <div class="ona-cmp-tile-v">{t.val}</div>
                            <div class="ona-cmp-tile-l">{t.lbl}</div>
                        </div>
                    </template>
                </div>
                <div class="ona-cmp-vs-mid"></div>
                <div class="ona-cmp-tiles-side">
                    <template for:each={cmpResults.tilesB} for:item="t">
                        <div key={t.lbl} class={t.cls}>
                            <div class="ona-cmp-tile-v">{t.val}</div>
                            <div class="ona-cmp-tile-l">{t.lbl}</div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Score rows -->
            <div class="ona-cmp-section-lbl" style="margin-top:14px">Relationship Scores</div>
            <template for:each={cmpResults.scoreRows} for:item="row">
                <div key={row.lbl} class="ona-cmp-score-row">
                    <div class="ona-cmp-score-side">
                        <div class="ona-cmp-score-top">
                            <span class="ona-cmp-score-val" style={row.styleA}>{row.valA}</span>
                            <template if:true={row.winA}><span class="ona-cmp-win-badge">Winner ✓</span></template>
                        </div>
                        <div class="ona-cmp-bar-track"><div class="ona-cmp-bar-fill" style={row.barStyleA}></div></div>
                    </div>
                    <div class="ona-cmp-score-lbl-mid">{row.lbl}</div>
                    <div class="ona-cmp-score-side">
                        <div class="ona-cmp-score-top">
                            <template if:true={row.winB}><span class="ona-cmp-win-badge">Winner ✓</span></template>
                            <span class="ona-cmp-score-val" style={row.styleB}>{row.valB}</span>
                        </div>
                        <div class="ona-cmp-bar-track"><div class="ona-cmp-bar-fill" style={row.barStyleB}></div></div>
                    </div>
                </div>
            </template>

            <!-- Velocity -->
            <div class="ona-cmp-section-lbl" style="margin-top:14px">Engagement Velocity</div>
            <div class="ona-cmp-vel-row">
                <div class="ona-cmp-vel-side">
                    <template for:each={cmpResults.velA} for:item="v">
                        <div key={v.lbl} class="ona-cmp-vel-item">
                            <div class="ona-cmp-vel-dot" style={v.dotStyle}></div>
                            <span class="ona-cmp-vel-lbl">{v.lbl}</span>
                            <div class="ona-cmp-vel-bar-track">
                                <div class="ona-cmp-vel-bar-fill" style={v.barStyle}></div>
                            </div>
                            <span class="ona-cmp-vel-num">{v.count}</span>
                        </div>
                    </template>
                </div>
                <div class="ona-cmp-vs-mid"></div>
                <div class="ona-cmp-vel-side">
                    <template for:each={cmpResults.velB} for:item="v">
                        <div key={v.lbl} class="ona-cmp-vel-item">
                            <div class="ona-cmp-vel-dot" style={v.dotStyle}></div>
                            <span class="ona-cmp-vel-lbl">{v.lbl}</span>
                            <div class="ona-cmp-vel-bar-track">
                                <div class="ona-cmp-vel-bar-fill" style={v.barStyle}></div>
                            </div>
                            <span class="ona-cmp-vel-num">{v.count}</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Top influencers -->
            <div class="ona-cmp-section-lbl" style="margin-top:14px">Top Influencers</div>
            <div class="ona-cmp-inf-row">
                <div class="ona-cmp-inf-side">
                    <template for:each={cmpResults.inflA} for:item="inf">
                        <div key={inf.id} class="ona-cmp-inf-item">
                            <div class="ona-cmp-inf-av" style={inf.avStyle}>{inf.ini}</div>
                            <div style="flex:1;min-width:0">
                                <div class="ona-cmp-inf-name">{inf.name}</div>
                                <div class="ona-cmp-inf-title">{inf.title}</div>
                            </div>
                            <span class="ona-cmp-inf-score">{inf.score}</span>
                        </div>
                    </template>
                </div>
                <div class="ona-cmp-vs-mid"></div>
                <div class="ona-cmp-inf-side">
                    <template for:each={cmpResults.inflB} for:item="inf">
                        <div key={inf.id} class="ona-cmp-inf-item">
                            <div class="ona-cmp-inf-av" style={inf.avStyle}>{inf.ini}</div>
                            <div style="flex:1;min-width:0">
                                <div class="ona-cmp-inf-name">{inf.name}</div>
                                <div class="ona-cmp-inf-title">{inf.title}</div>
                            </div>
                            <span class="ona-cmp-inf-score">{inf.score}</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Risk signals -->
            <div class="ona-cmp-section-lbl" style="margin-top:14px">Risk Signals</div>
            <div class="ona-cmp-risk-row">
                <div class="ona-cmp-risk-side">
                    <template for:each={cmpResults.riskA} for:item="r">
                        <div key={r.lbl} class="ona-cmp-risk-item">
                            <span class="ona-cmp-risk-ico">{r.ico}</span>
                            <span style={r.style}>{r.lbl}</span>
                        </div>
                    </template>
                </div>
                <div class="ona-cmp-vs-mid"></div>
                <div class="ona-cmp-risk-side">
                    <template for:each={cmpResults.riskB} for:item="r">
                        <div key={r.lbl} class="ona-cmp-risk-item">
                            <span class="ona-cmp-risk-ico">{r.ico}</span>
                            <span style={r.style}>{r.lbl}</span>
                        </div>
                    </template>
                </div>
            </div>

        </div>
        </template>
    </div>
    </template>

    <!-- ══ GUIDE OVERLAY ══════════════════════════════════════════════ -->
    <!-- ══ CAMPAIGN SLIDE-OVER PANEL ════════════════════════════════ -->
    <template if:true={campPanelOpen}>
    <div class="ona-camp-overlay">
        <div class="ona-camp-drawer">

            <!-- ── HEADER ─────────────────────────────────── -->
            <div class="ona-camp-hdr">
                <div class="ona-camp-hdr-icon">📢</div>
                <div class="ona-camp-hdr-text">
                    <div class="ona-camp-hdr-title">Add to Campaign</div>
                    <div class="ona-camp-hdr-sub">{campAutoLabel}</div>
                </div>
                <button class="ona-camp-close" onclick={handleCloseCampPanel} title="Close">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- ── RISK FILTER CHIPS ───────────────────────── -->
            <div class="ona-camp-chips-section">
                <div class="ona-camp-chips-label">Smart filter</div>
                <div class="ona-camp-chips-row">
                    <button class={campChipCooling} data-filter="cooling" onclick={handleCampChip}>
                        <span class="ona-camp-chip-dot" style="background:#f59e0b"></span>↓ Cooling
                    </button>
                    <button class={campChipCold} data-filter="cold" onclick={handleCampChip}>
                        <span class="ona-camp-chip-dot" style="background:#38bdf8"></span>❄ Cold
                    </button>
                    <button class={campChipDark} data-filter="dark" onclick={handleCampChip}>
                        <span class="ona-camp-chip-dot" style="background:#94a3b8"></span>◉ Dark
                    </button>
                </div>
                <div class="ona-camp-chips-row" style="margin-top:5px">
                    <button class="ona-camp-chip-outline" onclick={handleCampSelectAll}>✦ All at-risk</button>
                    <button class="ona-camp-chip-outline" onclick={handleCampClearSelection}>✕ Clear all</button>
                </div>
            </div>

            <!-- ── SELECTED CONTACTS ──────────────────────── -->
            <div class="ona-camp-contacts-hdr">
                <span class="ona-camp-contacts-lbl">Selected contacts</span>
                <span class="ona-camp-contacts-count">{campSelCountLabel}</span>
            </div>
            <div class="ona-camp-sel-list">
                <template if:true={hasCampSelected}>
                    <template for:each={campSelectedContacts} for:item="c">
                        <div key={c.contactId} class="ona-camp-sel-item">
                            <div class="ona-camp-av" style={c.avStyle}>{c.initials}</div>
                            <div class="ona-camp-sel-info">
                                <div class="ona-camp-sel-name">{c.name}</div>
                                <div class="ona-camp-sel-risk">{c.riskLabel}</div>
                            </div>
                            <button class="ona-camp-rm" data-id={c.contactId} onclick={handleCampDeselect} title="Remove">
                                <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                                    <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                    </template>
                </template>
                <template if:false={hasCampSelected}>
                    <div class="ona-camp-empty">
                        <div class="ona-camp-empty-ico">👥</div>
                        <div class="ona-camp-empty-msg">No contacts selected.<br/>Use filters above or click nodes on the graph.</div>
                    </div>
                </template>
            </div>

            <!-- ── DIVIDER ────────────────────────────────── -->
            <div class="ona-camp-divider"></div>

            <!-- ── CAMPAIGN SECTION ───────────────────────── -->
            <div class="ona-camp-section">
                <div class="ona-camp-section-title">Campaign</div>

                <!-- Mode tabs -->
                <div class="ona-camp-tabs">
                    <button class={campModeExistingClass} data-mode="existing" onclick={handleCampModeToggle}>Use existing</button>
                    <button class={campModeNewClass}      data-mode="new"      onclick={handleCampModeToggle}>Create new</button>
                </div>

                <!-- Existing campaign picker -->
                <template if:true={campModeIsExisting}>
                    <div class="ona-camp-field">
                        <label class="ona-camp-lbl">Select campaign</label>
                        <div class="ona-camp-select-wrap">
                            <select class="ona-camp-select" onchange={handleCampPick}>
                                <option value="">— Choose a campaign —</option>
                                <template for:each={existingCampaigns} for:item="camp">
                                    <option key={camp.Id} value={camp.Id}>{camp.Name}</option>
                                </template>
                            </select>
                        </div>
                        <template if:true={campLoading}>
                            <div class="ona-camp-loading">
                                <span class="ona-camp-loading-dot"></span>Loading campaigns…
                            </div>
                        </template>
                    </div>
                </template>

                <!-- New campaign form -->
                <template if:true={campModeIsNew}>
                    <div class="ona-camp-field">
                        <label class="ona-camp-lbl">Campaign name <span style="color:var(--dn)">*</span></label>
                        <input class="ona-camp-input" type="text" placeholder="e.g. Re-engagement Q3 2026" value={newCampName} oninput={handleNewCampName}/>
                    </div>
                    <div class="ona-camp-field">
                        <label class="ona-camp-lbl">Type</label>
                        <div class="ona-camp-select-wrap">
                            <select class="ona-camp-select" onchange={handleNewCampType}>
                                <option value="Email">📧 Email</option>
                                <option value="Event">🎪 Event</option>
                                <option value="Webinar">💻 Webinar</option>
                                <option value="Direct Mail">📬 Direct Mail</option>
                                <option value="Other">📌 Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="ona-camp-date-row">
                        <div class="ona-camp-field" style="flex:1">
                            <label class="ona-camp-lbl">Start date</label>
                            <input class="ona-camp-input" type="date" value={newCampStart} onchange={handleNewCampStart}/>
                        </div>
                        <div class="ona-camp-field" style="flex:1">
                            <label class="ona-camp-lbl">End date</label>
                            <input class="ona-camp-input" type="date" value={newCampEnd} onchange={handleNewCampEnd}/>
                        </div>
                    </div>
                </template>

                <!-- Member status -->
                <div class="ona-camp-field">
                    <label class="ona-camp-lbl">Member status</label>
                    <div class="ona-camp-status-row">
                        <button class={campStatusSent}      data-status="Sent"      onclick={handleCampStatusBtn}>Sent</button>
                        <button class={campStatusResponded} data-status="Responded" onclick={handleCampStatusBtn}>Responded</button>
                        <button class={campStatusPlanned}   data-status="Planned"   onclick={handleCampStatusBtn}>Planned</button>
                    </div>
                </div>
            </div>

            <!-- ── FOOTER ACTIONS ─────────────────────────── -->
            <div class="ona-camp-footer">
                <template if:true={campLastAdded}>
                    <div class="ona-camp-success">
                        <div class="ona-camp-success-ico">✓</div>
                        <div class="ona-camp-success-body">
                            <div class="ona-camp-success-msg">{campLastAdded}</div>
                            <button class="ona-camp-success-link" data-id={campLastId} onclick={handleOpenCampaign}>
                                Open Campaign record ↗
                            </button>
                        </div>
                    </div>
                </template>
                <button class="ona-camp-btn-add" disabled={campAddDisabled} onclick={handleCampAdd}>
                    Add {campSelCountLabel} to Campaign
                </button>
                <button class="ona-camp-btn-cancel" onclick={handleCloseCampPanel}>Cancel</button>
            </div>

        </div>
    </div>
    </template>
    <!-- ══ END CAMPAIGN SLIDE-OVER ════════════════════════════════════ -->

    <template if:true={guideOpen}>
        <div class="ona-guide-overlay" onclick={handleGuideOverlayClick}>
            <div class="ona-guide-spotlight" style={spotlightStyle}></div>
            <div class="ona-guide-card" style={guideCardStyle} onclick={stopProp}>
                <div class="ona-gc-header">
                    <span class="ona-gc-step">{guideStepLabel}</span>
                    <button class="ona-gc-close" onclick={closeGuide}>✕</button>
                </div>
                <div class="ona-gc-title">{currentStep.title}</div>
                <div class="ona-gc-body">{currentStep.body}</div>
                <template if:true={currentStep.tip}>
                    <div class="ona-gc-tip">{currentStep.tip}</div>
                </template>
                <template if:true={currentStep.isNew}>
                    <div class="ona-gc-new">✦ {currentStep.isNew}</div>
                </template>
                <div class="ona-gc-footer">
                    <div class="ona-gc-dots">
                        <template for:each={guideDots} for:item="dot">
                            <div key={dot.i} class={dot.cls}></div>
                        </template>
                    </div>
                    <div style="display:flex;gap:8px">
                        <button class="ona-gc-prev" onclick={guidePrev} disabled={isFirstStep}>← Back</button>
                        <button class="ona-gc-next" onclick={guideNext}>{guideNextLabel}</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

</div>
</template>
